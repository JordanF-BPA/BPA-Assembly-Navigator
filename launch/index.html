
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPA Assembly Navigator - Launch</title>
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3f5f8;
    color: #243247;
    margin: 0;
    padding: 35px 16px;
}
main {
    max-width: 720px;
    margin: auto;
    background: white;
    padding: 28px;
    border: 1px solid #dce2ea;
    border-radius: 10px;
}
h1 { font-size: 23px; }
.value {
    background: #f3f5f8;
    padding: 12px;
    border-radius: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
}
button {
    background: #245c9c;
    color: white;
    border: 0;
    border-radius: 5px;
    padding: 12px 18px;
    cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
.error { color: #b42318; }
p { line-height: 1.6; }
</style>
</head>
<body>
<main>
<h1>BPA Assembly Navigator - Launch Test</h1>
<p id="status">Checking navigation request...</p>

<h3>Assembly GUID</h3>
<div class="value" id="assembly">-</div>

<h3>IFC GlobalId</h3>
<div class="value" id="ifc">-</div>

<h3>Trimble Connect Project</h3>
<div class="value" id="project">-</div>

<p>
<button id="open" disabled>
    Copy Assembly GUID &amp; Open Trimble Connect
</button>
</p>

<p>
<button id="testMessaging" type="button">
    Open Trimble Connect
</button>
</p>

<p id="messagingResult">
    Messaging test not started.
</p>
</main>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(location.search);

let teklaGuid = params.get("teklaGuid") || "";
let ifcGuid = params.get("ifcGuid") || "";
const projectKey = params.get("projectKey") || "";

const projects = {
    "test-project":
        "https://web.connect.trimble.com/projects/l7enVCZktZA/viewer/3d/?modelId=LPDL2Rmxp1E"
};

const projectUrl = projects[projectKey] || "";

    const status = document.getElementById("status");
    const button = document.getElementById("open");

    const guidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    const ifcPattern = /^[A-Za-z0-9_$]{22}$/;

    function fail(message) {
        status.textContent = message;
        status.className = "error";
        button.disabled = true;
    }

    if (!guidPattern.test(teklaGuid)) {
        fail("Invalid or missing Tekla assembly GUID.");
        return;
    }

    if (!ifcPattern.test(ifcGuid)) {
        fail("Invalid or missing IFC GlobalId.");
        return;
    }

    let project;

    try {
        project = new URL(projectUrl);

        if (project.protocol !== "https:" ||
            project.hostname !== "web.connect.trimble.com" ||
            !/^\/projects\/[^/]+(?:\/|$)/.test(project.pathname) ||
            project.username ||
            project.password) {
            throw new Error("Invalid project URL");
        }
    } catch {
        fail("Invalid or missing Trimble Connect project URL.");
        return;
    }

    document.getElementById("assembly").textContent =
        teklaGuid;

    document.getElementById("ifc").textContent =
        ifcGuid;

    document.getElementById("project").textContent =
        project.href;

status.textContent =
"Navigation request validated successfully. " +
"Opening Trimble Connect...";

button.disabled = true;

// ============================================================
// STAGE 9D.6G.2G.18 - DIRECT LAUNCHER HANDOFF
// ============================================================

const testButton =
    document.getElementById("testMessaging");

const messagingResult =
    document.getElementById("messagingResult");
let connectWindow = null;
let handoffCompleted = false;

// Stage 9D.6G.2G.24A / 24B
let liveViewerWindow = null;
let liveRequestCounter = 0;
let liveRequestTimer = null;
let pendingLiveRequestId = null;

function reloadTrimbleConnect() {
    clearTimeout(liveRequestTimer);
    liveRequestTimer = null;
    pendingLiveRequestId = null;

    liveViewerWindow = null;
    handoffCompleted = false;

    if (!connectWindow || connectWindow.closed) {
        openTrimbleConnect();
        return;
    }

    connectWindow.location.href = projectExplorerUrl.href;
    connectWindow.focus();
}

function sendLiveNavigation() {
    if (!liveViewerWindow) {
        reloadTrimbleConnect();
        return;
    }

    const requestId = "BPA_LIVE_" + (++liveRequestCounter);

    pendingLiveRequestId = requestId;

    clearTimeout(liveRequestTimer);

    try {
        liveViewerWindow.postMessage(
            {
                type: "BPA_LIVE_NAVIGATE",
                requestId,
                guid: teklaGuid,
                projectId,
                modelId: project.searchParams.get("modelId")
            },
            "https://jordanf-bpa.github.io"
        );

        status.textContent =
            "Sending assembly to the existing 3D Viewer...";

        // Fallback only if the Viewer does not acknowledge receipt.
        liveRequestTimer = setTimeout(function () {
            if (pendingLiveRequestId !== requestId) {
                return;
            }

            pendingLiveRequestId = null;

            console.warn(
                "[BPA Stage 24B] Viewer did not respond. Reloading."
            );

            reloadTrimbleConnect();
        }, 5000);

    } catch (error) {
        console.error("[BPA Stage 24B]", error);
        pendingLiveRequestId = null;
        reloadTrimbleConnect();
    }
}

window.addEventListener("message", function (event) {

    if (
        event.origin !==
        "https://jordanf-bpa.github.io"
    ) {
        return;
    }

    const data = event.data;

    if (!data || data.type !== "BPA_VIEWER_READY") {
        return;
    }

    if (
        !connectWindow ||
        connectWindow.closed ||
        data.projectId !== projectId
    ) {
        return;
    }

    liveViewerWindow = event.source;

    event.source.postMessage(
        {
            type: "BPA_VIEWER_REGISTERED"
        },
        "https://jordanf-bpa.github.io"
    );

    console.log(
        "[BPA Stage 24A] Live Trimble Connect Viewer registered."
    );

    messagingResult.textContent =
        "Live Trimble Connect Viewer connected.";
});

// ============================================================
// STAGE 9D.6G.2G.24B - LIVE NAVIGATION ACKNOWLEDGEMENT
// ============================================================

window.addEventListener("message", function (event) {

    if (
        event.origin !== "https://jordanf-bpa.github.io" ||
        event.source !== liveViewerWindow
    ) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "BPA_LIVE_NAVIGATE_ACK" ||
        data.requestId !== pendingLiveRequestId
    ) {
        return;
    }

      clearTimeout(liveRequestTimer);
    liveRequestTimer = null;
    pendingLiveRequestId = null;

    status.textContent =
        "Assembly received by the live 3D Viewer.";

    messagingResult.textContent =
        "Live navigation request accepted. No page reload.";

    console.log(
        "[BPA Stage 24B] Live request acknowledged:",
        data.requestId
    );
});    

// Stage 9D.6G.2G.23B
// Receive new drawing links in the existing launcher.
const reuseChannel = new BroadcastChannel(
    "BPA_ASSEMBLY_NAVIGATOR_REUSE"
);

reuseChannel.addEventListener("message", function (event) {
    const data = event.data;

    if (!data || data.type !== "BPA_REUSE_REQUEST") {
        return;
    }

    if (
        !guidPattern.test(data.teklaGuid) ||
        !ifcPattern.test(data.ifcGuid) ||
        data.projectKey !== projectKey
    ) {
        return;
    }

    // Only an established launcher with an accessible
    // Trimble Connect window should accept the request.
    if (!connectWindow || connectWindow.closed) {
        return;
    }

    teklaGuid = data.teklaGuid;
    ifcGuid = data.ifcGuid;
    handoffCompleted = false;

    document.getElementById("assembly").textContent =
        teklaGuid;

    document.getElementById("ifc").textContent =
        ifcGuid;

    status.textContent =
        "New assembly received. Reopening BPA Navigator...";

    // Tell the new short-link page that this launcher
    // has accepted the assembly.
    reuseChannel.postMessage({
        type: "BPA_REUSE_ACCEPTED",
        requestId: data.requestId
    });

    // Stage 24B:
    // Send directly to the existing Viewer when available.
    // Otherwise use the working Project Explorer fallback.
    if (liveViewerWindow) {
        sendLiveNavigation();
    } else {
        reloadTrimbleConnect();
    }
});

const projectId =
    project.pathname.match(/^\/projects\/([^/]+)/)?.[1];

const projectExplorerUrl = new URL(
    "https://web.connect.trimble.com/projects/" +
    encodeURIComponent(projectId) +
    "/extension/" +
    "8a723075-30c4-8dca-6d25-bf77346a67e0/" +
    "BPA_NAVIGATOR"
);

// Listen before opening Trimble Connect.
window.addEventListener("message", function (event) {

    if (
        event.origin !==
        "https://jordanf-bpa.github.io"
    ) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "BPA_GUID_REQUEST" ||
        typeof data.requestId !== "string" ||
        !data.requestId
    ) {
        return;
    }

    if (!connectWindow || connectWindow.closed) {
        return;
    }

    if (handoffCompleted) {
        return;
    }

    // Respond to the requesting BPA iframe.
    if (!event.source) {
        return;
    }

    console.log(
        "[BPA Launcher] GUID requested:",
        data.requestId
    );

    event.source.postMessage(
        {
            type: "BPA_GUID_RESPONSE",
            requestId: data.requestId,
            guid: teklaGuid,
            projectId,
            modelId: project.searchParams.get("modelId")
        },
        "https://jordanf-bpa.github.io"
    );

    handoffCompleted = true;

    messagingResult.textContent =
        "Assembly GUID sent to BPA Navigator.";

    status.textContent =
        "GUID transferred. Trimble Connect is opening the assembly.";
});

// ============================================================
// STAGE 9D.6G.2G.20 - AUTOMATIC TRIMBLE CONNECT LAUNCH
// ============================================================

function openTrimbleConnect() {

    if (connectWindow && !connectWindow.closed) {
        connectWindow.focus();
        return true;
    }

    handoffCompleted = false;

connectWindow = window.open(
    projectExplorerUrl.href,
    "BPA_TRIMBLE_CONNECT"
);

    if (!connectWindow) {
        messagingResult.textContent =
            "Automatic opening was blocked. " +
            "Click the button to open Trimble Connect.";

        testButton.disabled = false;
        testButton.style.display = "";

        return false;
    }

    messagingResult.textContent =
        "Trimble Connect opened. Waiting for BPA Navigator...";

    console.log(
        "[BPA Launcher] Project Explorer opened:",
        projectExplorerUrl.href
    );

    testButton.style.display = "none";

    return true;
}

// Keep the existing button as a fallback.
testButton.addEventListener("click", openTrimbleConnect);

// Attempt automatic opening once the launcher is ready.
if (
    teklaGuid &&
    projectId &&
    projectExplorerUrl
) {
    messagingResult.textContent =
        "Automatically opening Trimble Connect...";

    openTrimbleConnect();
}
// STAGE 9D.5B.1 - STORAGE TEST
try {
    localStorage.setItem(
        "BPA_NAVIGATOR_STORAGE_TEST",
        teklaGuid
    );

    console.log(
        "[BPA Storage Test] Saved:",
        localStorage.getItem(
            "BPA_NAVIGATOR_STORAGE_TEST"
        )
    );
} catch (error) {
    console.error(
        "[BPA Storage Test] Write failed:",
        error
    );
}

button.addEventListener("click", async function () {
    try {
        // Copy the drawing assembly GUID.
        await navigator.clipboard.writeText(teklaGuid);

        // Open the correct Trimble Connect project.
        window.location.assign(project.href);
    } catch (error) {
        status.textContent =
            "Could not copy the GUID automatically. " +
            "Copy the displayed GUID manually, then open Trimble Connect.";

        console.error(
            "[BPA Navigator] Clipboard error:",
            error
        );
    }
});
})();
</script>
</body>
</html>

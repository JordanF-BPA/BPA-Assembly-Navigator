
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPA Assembly Navigator - Launch</title>
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3f5f8;
    color: #243247;
    margin: 0;
    padding: 35px 16px;
}
main {
    max-width: 720px;
    margin: auto;
    background: white;
    padding: 28px;
    border: 1px solid #dce2ea;
    border-radius: 10px;
}
h1 { font-size: 23px; }
.value {
    background: #f3f5f8;
    padding: 12px;
    border-radius: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
}
button {
    background: #245c9c;
    color: white;
    border: 0;
    border-radius: 5px;
    padding: 12px 18px;
    cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
.error { color: #b42318; }
p { line-height: 1.6; }
</style>
</head>
<body>
<main>
<h1>BPA Assembly Navigator - Launch Test</h1>
<p id="status">Checking navigation request...</p>

<h3>Assembly GUID</h3>
<div class="value" id="assembly">-</div>

<h3>IFC GlobalId</h3>
<div class="value" id="ifc">-</div>

<h3>Trimble Connect Project</h3>
<div class="value" id="project">-</div>

<p>
<button id="open" disabled>
    Copy Assembly GUID &amp; Open Trimble Connect
</button>
</p>

<p>
After Trimble Connect opens, manually activate
BPA Assembly Navigator. Automatic GUID handoff
will be investigated in the next stage.
</p>
</main>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(location.search);

    const teklaGuid = params.get("teklaGuid") || "";
    const ifcGuid = params.get("ifcGuid") || "";
    const projectUrl = params.get("projectUrl") || "";

    const status = document.getElementById("status");
    const button = document.getElementById("open");

    const guidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    const ifcPattern = /^[A-Za-z0-9_$]{22}$/;

    function fail(message) {
        status.textContent = message;
        status.className = "error";
        button.disabled = true;
    }

    if (!guidPattern.test(teklaGuid)) {
        fail("Invalid or missing Tekla assembly GUID.");
        return;
    }

    if (!ifcPattern.test(ifcGuid)) {
        fail("Invalid or missing IFC GlobalId.");
        return;
    }

    let project;

    try {
        project = new URL(projectUrl);

        if (project.protocol !== "https:" ||
            project.hostname !== "web.connect.trimble.com" ||
            !/^\/projects\/[^/]+(?:\/|$)/.test(project.pathname) ||
            project.username ||
            project.password) {
            throw new Error("Invalid project URL");
        }
    } catch {
        fail("Invalid or missing Trimble Connect project URL.");
        return;
    }

    document.getElementById("assembly").textContent =
        teklaGuid;

    document.getElementById("ifc").textContent =
        ifcGuid;

    document.getElementById("project").textContent =
        project.href;

status.textContent =
    "Navigation request validated successfully.";

button.disabled = false;

// STAGE 9D.5B.1 - STORAGE TEST
try {
    localStorage.setItem(
        "BPA_NAVIGATOR_STORAGE_TEST",
        teklaGuid
    );

    console.log(
        "[BPA Storage Test] Saved:",
        localStorage.getItem(
            "BPA_NAVIGATOR_STORAGE_TEST"
        )
    );
} catch (error) {
    console.error(
        "[BPA Storage Test] Write failed:",
        error
    );
}

button.addEventListener("click", async function () {
    try {
        // Copy the drawing assembly GUID.
        await navigator.clipboard.writeText(teklaGuid);

        // Open the correct Trimble Connect project.
        window.location.assign(project.href);
    } catch (error) {
        status.textContent =
            "Could not copy the GUID automatically. " +
            "Copy the displayed GUID manually, then open Trimble Connect.";

        console.error(
            "[BPA Navigator] Clipboard error:",
            error
        );
    }
});
})();
</script>
</body>
</html>

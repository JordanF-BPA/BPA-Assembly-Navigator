
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPA Assembly Navigator - Launch</title>
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3f5f8;
    color: #243247;
    margin: 0;
    padding: 35px 16px;
}
main {
    max-width: 720px;
    margin: auto;
    background: white;
    padding: 28px;
    border: 1px solid #dce2ea;
    border-radius: 10px;
}
h1 { font-size: 23px; }
.value {
    background: #f3f5f8;
    padding: 12px;
    border-radius: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
}
button {
    background: #245c9c;
    color: white;
    border: 0;
    border-radius: 5px;
    padding: 12px 18px;
    cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
.error { color: #b42318; }
p { line-height: 1.6; }
</style>
</head>
<body>
<main>
<h1>BPA Assembly Navigator - Launch Test</h1>
<p id="status">Checking navigation request...</p>

<h3>Assembly GUID</h3>
<div class="value" id="assembly">-</div>

<h3>IFC GlobalId</h3>
<div class="value" id="ifc">-</div>

<h3>Trimble Connect Project</h3>
<div class="value" id="project">-</div>

<p>
<button id="open" disabled>
    Copy Assembly GUID &amp; Open Trimble Connect
</button>
</p>

<p>
<button id="testMessaging" type="button">
    Test Launcher Messaging
</button>
</p>

<p id="messagingResult">
    Messaging test not started.
</p>
</main>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(location.search);

    const teklaGuid = params.get("teklaGuid") || "";
    const ifcGuid = params.get("ifcGuid") || "";
const projectKey = params.get("projectKey") || "";

const projects = {
    "test-project":
        "https://web.connect.trimble.com/projects/l7enVCZktZA/viewer/3d/?modelId=LPDL2Rmxp1E"
};

const projectUrl = projects[projectKey] || "";

    const status = document.getElementById("status");
    const button = document.getElementById("open");

    const guidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    const ifcPattern = /^[A-Za-z0-9_$]{22}$/;

    function fail(message) {
        status.textContent = message;
        status.className = "error";
        button.disabled = true;
    }

    if (!guidPattern.test(teklaGuid)) {
        fail("Invalid or missing Tekla assembly GUID.");
        return;
    }

    if (!ifcPattern.test(ifcGuid)) {
        fail("Invalid or missing IFC GlobalId.");
        return;
    }

    let project;

    try {
        project = new URL(projectUrl);

        if (project.protocol !== "https:" ||
            project.hostname !== "web.connect.trimble.com" ||
            !/^\/projects\/[^/]+(?:\/|$)/.test(project.pathname) ||
            project.username ||
            project.password) {
            throw new Error("Invalid project URL");
        }
    } catch {
        fail("Invalid or missing Trimble Connect project URL.");
        return;
    }

    document.getElementById("assembly").textContent =
        teklaGuid;

    document.getElementById("ifc").textContent =
        ifcGuid;

    document.getElementById("project").textContent =
        project.href;

status.textContent =
"Navigation request validated successfully. " +
"Opening Trimble Connect...";

button.disabled = true;

// Stage 9D.6G.2G.16
// Temporary test: keep launcher open.

const testButton =
    document.getElementById("testMessaging");

const messagingResult =
    document.getElementById("messagingResult");

testButton.addEventListener("click", function () {

    const targetUrl = new URL(project.href);

    targetUrl.hash =
        "teklaGuid=" + encodeURIComponent(teklaGuid);

    const connectWindow = window.open(
        targetUrl.href,
        "_blank"
    );

    if (!connectWindow) {
        messagingResult.textContent =
            "Popup blocked. Allow popups and retry.";
        return;
    }

    messagingResult.textContent =
        "Trimble Connect opened. Waiting for reply...";

    window.addEventListener("message", function (event) {

        if (
            event.origin !==
            "https://web.connect.trimble.com"
        ) {
            return;
        }

        if (event.source !== connectWindow) {
            return;
        }

        if (
            event.data?.type ===
            "BPA_LAUNCHER_REPLY"
        ) {
            messagingResult.textContent =
                "Reply received from Trimble Connect.";

            console.log(
                "[BPA Launcher] Reply:",
                event.data
            );
        }
    });

    // Expose the window reference for testing.
    window.BPA_testConnectWindow = connectWindow;

    console.log(
        "[BPA Launcher] Opened:",
        targetUrl.href
    );
});

// STAGE 9D.5B.1 - STORAGE TEST
try {
    localStorage.setItem(
        "BPA_NAVIGATOR_STORAGE_TEST",
        teklaGuid
    );

    console.log(
        "[BPA Storage Test] Saved:",
        localStorage.getItem(
            "BPA_NAVIGATOR_STORAGE_TEST"
        )
    );
} catch (error) {
    console.error(
        "[BPA Storage Test] Write failed:",
        error
    );
}

button.addEventListener("click", async function () {
    try {
        // Copy the drawing assembly GUID.
        await navigator.clipboard.writeText(teklaGuid);

        // Open the correct Trimble Connect project.
        window.location.assign(project.href);
    } catch (error) {
        status.textContent =
            "Could not copy the GUID automatically. " +
            "Copy the displayed GUID manually, then open Trimble Connect.";

        console.error(
            "[BPA Navigator] Clipboard error:",
            error
        );
    }
});
})();
</script>
</body>
</html>

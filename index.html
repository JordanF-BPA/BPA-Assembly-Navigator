<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BPA Assembly Navigator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js" defer></script>
<script src="app.js?v=2D3B-15" defer></script>
</head>
<body>
<header>
  <div class="brand">BPA</div>
  <div>
    <h1>Assembly Navigator</h1>
<p>Trimble Connect • Stage 2D.3B.7C</p>
  </div>
</header>
  <main>
    <label for="guid">Tekla assembly GUID</label>
	  <input
	  id="guid"
	  spellcheck="false"
	  placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
>
    <label for="model">Loaded model</label>
    <select id="model"><option value="">Connect to viewer first</option></select>
<div class="ghost-controls">
  <label>
    <input type="checkbox" id="ghostMode" disabled>
    Native Ghost Mode (status only)
  </label>

<button id="inspectGhost" type="button">
  Read Ghost Mode State
</button>

<button id="inspectGhostApi" type="button">
  Check Ghost Mode API Support
</button>

<button id="inspectViewerSettings" type="button">
  Inspect Viewer Settings
</button>

<button id="inspectOpacitySupport" type="button">
  Inspect Opacity Support
</button>
</div>

<div class="ghost-controls">
  <label>Stage 2D.3B.7C — Transparency Test</label>

  <button id="testTransparency" type="button">
    Test Assembly Transparency
  </button>

  <button id="restoreTransparency" type="button">
    Restore Appearance
  </button>
</div>

<div class="actions"><button id="connect">Connect / Refresh Models</button><button id="read">Read Selected Object</button><button id="find" class="primary">
  Isolate, Select &amp; Zoom
</button></div>
    <p id="status" role="status">Waiting to connect.</p>
    <label for="log">Diagnostic results</label>
    <pre id="log" aria-live="polite"></pre>
    <p class="help">Open the required IFC model in Trimble Connect's 3D viewer before searching. This extension uses the original 36-character Tekla GUID.</p>
  </main>
</body>
</html>


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BPA Assembly Navigator</title>

  <link rel="stylesheet" href="styles.css?v=stepper-drag-1">

  <script
    src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"
    defer>
  </script>

<script src="assembly-stepper.js?v=3" defer></script>
<script src="app.js?v=assembly-stepper-1" defer></script>
<script src="connect-tab-trial.js?v=4" defer></script>
</head>

<body>

  <header>
    <div class="brand">BPA</div>

    <div>
      <h1>Assembly Navigator</h1>
      <p>Trimble Connect</p>
    </div>
  </header>

  <main>

    <label for="guid">Tekla assembly GUID</label>

    <input
      id="guid"
      type="text"
      spellcheck="false"
      autocomplete="off"
      placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    >

    <label for="model">Loaded IFC model</label>

    <select id="model">
      <option value="">Connect to viewer first</option>
    </select>

    <div class="actions">

<button id="connect" type="button">
    Connect / Refresh Models
</button>

<button id="pasteDrawingGuid" class="primary" type="button">
    Paste Drawing GUID &amp; Connect
</button>

<button id="find" class="primary" type="button">
    Find Assembly
</button>

      <button id="restoreNavigation" type="button" disabled>
        Restore Model Appearance
      </button>

    </div>

    <p id="status" role="status" aria-live="polite">
      Waiting to connect.
    </p>

    <p class="help">
      Open the required IFC model in Trimble Connect's
      3D viewer before searching. Enter the original
      36-character Tekla assembly GUID.
    </p>

    <details class="activity-details">
      <summary>Activity Log</summary>
      <pre id="log"></pre>
    </details>

  </main>

  <dialog id="assemblyStepper" aria-labelledby="assemblyStepperTitle">
    <strong id="assemblyStepperTitle" tabindex="0" title="Drag to move, or use arrow keys when focused">Drawing assemblies</strong>
    <p id="assemblyStepperCount" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="assemblyPrevious" type="button" aria-label="Previous assembly">&#8592; Previous</button>
      <button id="assemblyNext" type="button" aria-label="Next assembly">Next &#8594;</button>
      <button id="assemblyAll" type="button">Show all</button>
    </div>
  </dialog>
</body>
</html>
